---

name: Publish WIP release tarball

on: push

jobs:
  release-wip:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true

      - name: Checkout actions repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: mat3ra/actions
          # TODO: drop `ref` once mat3ra/actions#44 (revert to composite actions) merges
          ref: revert/reusable-workflow-call-attempt
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: actions

      - name: Publish WIP release tarball
        uses: ./actions/js/release-wip
        with:
          package-name: esse
          build-script: transpile-and-build-assets
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
