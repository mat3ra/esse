# Deploy previews for the published site (schemas.mat3ra.com is served from GitHub Pages
# off `dev`; Netlify previews any branch or pull request from the same build).
[build]
  command = "npm run build-site"
  publish = "site"

[build.environment]
  NODE_VERSION = "20"

# The explorer, docs and map are static. graph.json and views.json are the two data assets
# the client fetches at runtime, and both are rebuilt on every deploy.
[[headers]]
  for = "/graph.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/views.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
