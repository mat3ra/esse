#
# `file:` - a final JSON file
# ` - key` - file content key
# ` - key?` - optional file content key
# ` - key = ` - file content assignment to types of values
# ` = [value]` - list of values "value"
# ` = ( x | y | z ){2}` - a set of values "1 or 2 of any of the three"
#

material:

primitive:
  base:
    crystal: material
    crystal_site:
      # created by reference to some crystal, can be populated with atom, vacancy, void, can be merged with a crystal of the same lattice
      - reference_crystal
      - crystal_coordinate
      - id? # to the reference crystal
    atom:
      - chemical_element
    vacuum:
      # is applied along the specified direction, adds vacuum "slab", breaks periodicity in that direction, lowers dimensionality
      - direction
      - size
    void:
      # can be placed into a crystal centered around specified crystal_site, all atoms inside are removed
      - center_coordinate
      - shape

  modifications:
    strain:
      # can be applied to a crystal, modifies the lattice parameters and preserves basis in crystal coordinates
      - matrix
    repeat:
      - integer_matrix
    perturb:
      # changes coordinates of atoms by applying the function, intended for local displacements
      - function f(x,y,z) # ∂r = f(x, y, z)
      - is_isometric = (true | false)  # distance preservation -- isometric transformation -- only makes sense in 2D and 1D thin structures
    fold:
      # maps 2D flat plane to a curved surface in 3D space
      - function f(x, y) -> (x, y, z)
      - is_isometric = (true | false)
  combinations:
    stack_component:
      - material | vacuum
    stack:
      - stack_components = [ stack_component, ... ]
      - direction = (x | y | z){1}
    merge:
      - structures = [ structure_i ]
      - method = ("adding" | "replacing" | "yielding" | "smart")

pristine_structures:
  three-dimensional:
    ideal_crystal: ref:/primitive/base/crystal
    repeated:
      supercell:
        - crystal = ref:/primitive/base/crystal
        - matrix
    strained:
      strained_uniform:
        - crystal = ref:/primitive/base/crystal
        - strain_percentage
      strained_non-uniform:
        - crystal = ref:/primitive/base/crystal
        - strain_matrix

  two-dimensional:
    layer:
      - merge(void, crystal) # reduction of bulk to chemically equivalent monolayer
      - miller_indices = [ h, k, l ]
      # Property:
      - termination  # stoichiometry + symmetry. In code can be allowed to be index, chemical formula, symmetry
    monolayer:
      - stack:
          - stack_components = [ layer, vacuum ]
          - direction = "z"
    slab:
      - stack = [ layer ..., vacuum ] # consecutive layers
      - number_of_layers
      - terminations = [ top, bottom ] # stoichiometry + symmetry. In code can be allowed to be index, chemical formula, symmetry
    slab_with_reconstruction:
      - slab = ref:/pristine_structures/two-dimensional/slab
      - reconstruction:
          - has_reconstruction = (true | false)
          - reconstruction_type? # Enum that applies an algorithm
          - reconstruction_function? # Function that changes coordinates of atoms

  one-dimensional:
    nanotape:
      # we created a supercell from monolayer, cut the shape and added vacuum on one side
      - stack:
          - structures = [ merge(void, supercell(monolayer)), vacuum ]
          - direction = (x | y){1} # 1 side
    nanowire:
      # we created a supercell, cut the shape and added vacuum on any two sides
      - stack:
          - structures: [ merge(void, supercell(crystal)), vacuum ]
          - distances: [ 0, 0 ]
          - direction: (x | y | z){2} # 2 sides
    nanotube:
      # we applied an embedding function to a 3D surface and added vacuum on any sides
      - stack:
          - structures: [ fold(supercell(monolayer)), vacuum ]
          - distances: [ 0, 0 ]
          - direction: (x | y | z){2,3} # 2 or 3 sides

  zero-dimensional:
    nanoparticle:
      # we created a supercell, cut the shape and added vacuum on all sides
      - stack:
          - structures: [ merge(void, supercell(crystal)), vacuum ]
          - distances: [ 0, 0 ]
          - direction: (x | y | z){3} # 3 sides
    nanoribbon:
      # we created a monolayer supercell, cut the shape and added vacuum on all sides
      - stack:
          - structures: [ merge(void, supercell(monolayer)), vacuum ]
          - distances: [ 0, 0 ]
          - direction: (x | y | z){3} # 3 sides

complex_structures:
  two-dimensional:
    multi-layer:
      - crystal = ref:/primitive/base/crystal
      # In the code properties below can be supplied externally or generated based on the above with a wizard
      - stacking_order? # Natural by default, can be described as a ABC... configurations based on the symmetry


